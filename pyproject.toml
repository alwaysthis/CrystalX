[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalx"
version = "0.9.2"
description = "Crystal structure visualization and editing desktop application"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
